# Shared defaults for ./llm (and the start.sh / stop.sh / status.sh / clone.sh
# wrappers). Committed to git, so keep machine-specific values and secrets out:
# put them in agents.local.conf (gitignored; see agents.local.conf.example).
#
# Precedence: environment variable > agents.local.conf > this file.
# Every line here uses VAR="${VAR:-default}" so it only fills in what is unset.

# Address FreeLLMAPI and Ollama listen on. 0.0.0.0 = every interface on this
# machine, so each instance answers on localhost AND on the LAN IP below.
# 127.0.0.1 keeps them on this machine only.
BIND_HOST="${BIND_HOST:-0.0.0.0}"

# This machine's LAN IP. Other devices reach an instance at http://LAN_IP:<port>;
# the scripts print it and check instances answer on it. Empty = skip.
# Set it in agents.local.conf, and reserve the IP in your router.
LAN_IP="${LAN_IP:-}"

# FreeLLMAPI: agent N listens on BASE_PORT + N - 1 (3001, 3002, ...).
BASE_PORT="${BASE_PORT:-3001}"

# FreeLLMAPI failover budget (ms). Free providers often hang 30-60s before
# failing; FreeLLMAPI's 45s default then leaves no time to fail over to one that
# works, and the chat sees "HTTP 502 ... retry time budget 45s exceeded".
# Aether waits up to 300s for a reply, so 120s is safe. 0 = no budget.
export FALLBACK_TIME_BUDGET_MS="${FALLBACK_TIME_BUDGET_MS:-120000}"

# Ollama: instance N listens on OLLAMA_BASE_PORT + N - 1 (11435, 11436, ...).
# 11434 is skipped so the Ollama app / system service can keep running alongside.
OLLAMA_BASE_PORT="${OLLAMA_BASE_PORT:-11435}"

# Aether chat (./llm start aether): aether-code's browser mode. You use it in
# the panel's Chat tab (http://localhost:PANEL_PORT/#chat); its own server stays
# on 127.0.0.1 because its engineers can run commands and edit files. Same data
# as the Aether desktop app (~/.aether-lite). AETHER_CODE_DIR is the aether-code
# checkout to run; it is cloned there on first start if missing. To use the
# checkout you already have, point AETHER_CODE_DIR at it.
AETHER_PORT="${AETHER_PORT:-3910}"
AETHER_HOST="${AETHER_HOST:-127.0.0.1}"
AETHER_WEB_TOKEN="${AETHER_WEB_TOKEN:-}"
AETHER_CODE_DIR="${AETHER_CODE_DIR:-}"
# Browser mode (web.py) lives on this aether-code branch, not on main yet.
AETHER_CODE_REF="${AETHER_CODE_REF:-lead-summary-attachments-themes}"

# The panel (./llm start panel): chat + services on one page. It can start and
# stop services and reach the chat, so it only listens on this machine by
# default. To open it from other devices, set PANEL_HOST=0.0.0.0 AND a
# PANEL_TOKEN in agents.local.conf, then browse to
# http://LAN_IP:PANEL_PORT/#token=<the token>.
PANEL_PORT="${PANEL_PORT:-3900}"
PANEL_HOST="${PANEL_HOST:-127.0.0.1}"
PANEL_TOKEN="${PANEL_TOKEN:-}"
